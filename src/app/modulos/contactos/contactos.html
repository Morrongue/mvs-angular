<!-- Hero -->
<section class="bg-[#0a0f1e] pt-20 pb-12 text-center">
  <div class="max-w-4xl mx-auto px-6">
    <p class="text-[#00e5a0] font-mono text-sm mb-4">¿Tienes un proyecto en mente?</p>
    <h1 class="text-5xl font-bold text-white mb-4">Hablemos</h1>
    <p class="text-gray-400 font-mono">Cuéntanos tu idea y te responderemos en menos de 24 horas.</p>
  </div>
</section>

<!-- Contact Section -->
<section class="bg-[#060d1a] py-20">
  <div class="max-w-6xl mx-auto px-6 grid grid-cols-1 lg:grid-cols-2 gap-16">
    <!-- Info -->
    <div>
      <h2 class="text-3xl font-bold text-white mb-8">Información de contacto</h2>

      <div class="space-y-6 mb-12">
        <div *ngFor="let info of contactInfo" class="flex items-start gap-4 group">
          <div class="w-12 h-12 bg-[#00e5a0]/10 rounded-xl flex items-center justify-center flex-shrink-0 group-hover:bg-[#00e5a0]/20 transition-colors duration-300">
            <span class="text-xl">{{ info.icon }}</span>
          </div>
          <div>
            <p class="text-gray-500 text-sm font-mono">{{ info.label }}</p>
            <p class="text-white font-medium">{{ info.value }}</p>
          </div>
        </div>
      </div>

      <!-- Social links -->
      <div>
        <p class="text-gray-500 text-sm font-mono mb-4">Síguenos en redes</p>
        <div class="flex gap-4">
          <a href="https://instagram.com" target="_blank"
            class="w-12 h-12 bg-[#0d1526] border border-[#00e5a0]/20 rounded-xl flex items-center justify-center text-gray-400 hover:text-[#00e5a0] hover:border-[#00e5a0] transition-all duration-300 hover:scale-110">

          </a>
          <a href="https://linkedin.com" target="_blank"
            class="w-12 h-12 bg-[#0d1526] border border-[#00e5a0]/20 rounded-xl flex items-center justify-center text-gray-400 hover:text-[#00e5a0] hover:border-[#00e5a0] transition-all duration-300 hover:scale-110">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
          </a>
          <a href="https://wa.me/573146259584" target="_blank"
            class="w-12 h-12 bg-[#0d1526] border border-[#00e5a0]/20 rounded-xl flex items-center justify-center text-gray-400 hover:text-[#25D366] hover:border-[#25D366] transition-all duration-300 hover:scale-110">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
          </a>
        </div>
      </div>
    </div>

    <!-- Form -->
    <div class="bg-[#0d1526] border border-[#00e5a0]/10 rounded-2xl p-8">
      <h2 class="text-2xl font-bold text-white mb-6">Envíanos un mensaje</h2>

      <div *ngIf="submitted" class="text-center py-12">
        <div class="text-6xl mb-4">✅</div>
        <h3 class="text-white font-bold text-xl mb-2">¡Mensaje enviado!</h3>
        <p class="text-gray-400">Te contactaremos pronto.</p>
      </div>

      <form *ngIf="!submitted" (ngSubmit)="onSubmit()" #f="ngForm" class="space-y-5">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="text-gray-400 text-sm font-mono block mb-2">Nombre</label>
            <input
              type="text"
              name="nombre"
              [(ngModel)]="form.nombre"
              required
              placeholder="Tu nombre"
              class="w-full bg-[#060d1a] border border-[#00e5a0]/20 rounded-lg px-4 py-3 text-white placeholder-gray-600 focus:outline-none focus:border-[#00e5a0] transition-colors duration-300"
            />
          </div>
          <div>
            <label class="text-gray-400 text-sm font-mono block mb-2">Email</label>
            <input
              type="email"
              name="email"
              [(ngModel)]="form.email"
              required
              placeholder="tu@email.com"
              class="w-full bg-[#060d1a] border border-[#00e5a0]/20 rounded-lg px-4 py-3 text-white placeholder-gray-600 focus:outline-none focus:border-[#00e5a0] transition-colors duration-300"
            />
          </div>
        </div>

        <div>
          <label class="text-gray-400 text-sm font-mono block mb-2">Servicio de interés</label>
          <select
            name="servicio"
            [(ngModel)]="form.servicio"
            class="w-full bg-[#060d1a] border border-[#00e5a0]/20 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-[#00e5a0] transition-colors duration-300"
          >
            <option value="">Selecciona un servicio</option>
            <option>One Page</option>
            <option>Sitio Web</option>
            <option>E-commerce</option>
            <option>Mantenimiento</option>
            <option>Otro</option>
          </select>
        </div>

        <div>
          <label class="text-gray-400 text-sm font-mono block mb-2">Mensaje</label>
          <textarea
            name="mensaje"
            [(ngModel)]="form.mensaje"
            required
            rows="5"
            placeholder="Cuéntanos sobre tu proyecto..."
            class="w-full bg-[#060d1a] border border-[#00e5a0]/20 rounded-lg px-4 py-3 text-white placeholder-gray-600 focus:outline-none focus:border-[#00e5a0] transition-colors duration-300 resize-none"
          ></textarea>
        </div>

        <button
          type="submit"
          class="w-full bg-[#00e5a0] text-[#0a0f1e] font-bold py-4 rounded-xl hover:bg-[#00c88a] transition-all duration-300 hover:scale-[1.02] hover:shadow-lg hover:shadow-[#00e5a0]/30"
        >
          Enviar mensaje →
        </button>
      </form>
    </div>
  </div>
</section>
