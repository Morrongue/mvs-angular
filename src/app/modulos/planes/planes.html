<!-- Hero -->
<section class="bg-[#0a0f1e] pt-20 pb-12 text-center">
  <div class="max-w-4xl mx-auto px-6">
    <h1 class="text-5xl font-bold text-white mb-4">Elige el plan perfecto para ti</h1>
    <p class="text-gray-400 font-mono">Planes flexibles diseñados para adaptarse a las necesidades de tu negocio</p>
  </div>
</section>

<!-- Category Tabs -->
<section class="bg-[#0a0f1e] pb-24">
  <div class="max-w-7xl mx-auto px-6">
    <div class="flex justify-center mb-12">
      <div class="bg-[#0d1526] border border-[#00e5a0]/20 rounded-xl p-1 flex gap-1">
        <button
          *ngFor="let cat of categories"
          (click)="activeCategory = cat"
          [class.bg-[#00e5a0]]="activeCategory === cat"
          [class.text-[#0a0f1e]]="activeCategory === cat"
          [class.font-bold]="activeCategory === cat"
          [class.text-white]="activeCategory !== cat"
          class="px-8 py-3 rounded-lg transition-all duration-300 font-medium"
        >
          {{ cat }}
        </button>
      </div>
    </div>

    <!-- Plans Grid -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8 items-start">
      <div
        *ngFor="let plan of filteredPlans"
        [class.border-[#00e5a0]/40]="plan.popular"
        [class.border-[#00e5a0]/10]="!plan.popular"
        [class.scale-105]="plan.popular"
        class="bg-[#0d1526] border rounded-2xl p-8 relative hover:-translate-y-1 transition-all duration-300"
      >
        <!-- Popular badge -->
        <div
          *ngIf="plan.popular"
          class="absolute -top-4 left-1/2 -translate-x-1/2 bg-[#00e5a0] text-[#0a0f1e] text-xs font-bold px-4 py-2 rounded-full flex items-center gap-1"
        >
          ⭐ MÁS POPULAR
        </div>

        <h3 class="text-white font-bold text-2xl mb-4">{{ plan.name }}</h3>

        <!-- Price -->
        <div class="mb-6">
          <div class="text-gray-500 line-through text-sm mb-1">${{ plan.originalPrice }}</div>
          <div class="text-[#00e5a0] font-bold text-4xl">${{ plan.price }}</div>
          <div class="text-gray-500 text-sm">+IVA</div>
        </div>

        <!-- Features -->
        <ul class="space-y-3 mb-8">
          <li *ngFor="let feat of plan.features" class="flex items-start gap-3 text-sm">
            <svg
              *ngIf="feat.included"
              class="w-4 h-4 text-[#00e5a0] flex-shrink-0 mt-0.5"
              fill="none" stroke="currentColor" viewBox="0 0 24 24"
            >
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
            <svg
              *ngIf="!feat.included"
              class="w-4 h-4 text-red-400 flex-shrink-0 mt-0.5"
              fill="none" stroke="currentColor" viewBox="0 0 24 24"
            >
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
            <span [class.text-gray-300]="feat.included" [class.text-gray-500]="!feat.included">
              {{ feat.label }}
            </span>
          </li>
        </ul>

        <a
          routerLink="/contactos"
          [class.bg-[#00e5a0]]="plan.popular"
          [class.text-[#0a0f1e]]="plan.popular"
          [class.border-[#00e5a0]]="!plan.popular"
          [class.text-[#00e5a0]]="!plan.popular"
          class="block text-center font-bold py-3 rounded-xl border transition-all duration-300 hover:scale-105"
          [ngClass]="plan.popular ? 'hover:bg-[#00c88a]' : 'hover:bg-[#00e5a0]/10'"
        >
          Contratar plan
        </a>
      </div>
    </div>
  </div>
</section>
