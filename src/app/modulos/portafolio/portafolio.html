<!-- Hero -->
<section class="bg-[#0a0f1e] pt-20 pb-12 text-center">
  <div class="max-w-4xl mx-auto px-6">
    <h1 class="text-5xl font-bold text-white mb-4">Portafolio de Trabajos Realizados</h1>
    <p class="text-gray-400 font-mono">Conoce algunos de los proyectos exitosos que hemos desarrollado para nuestros clientes</p>
  </div>
</section>

<!-- Filter Tabs -->
<section class="bg-[#0a0f1e] pb-20">
  <div class="max-w-7xl mx-auto px-6">
    <!-- Tabs -->
    <div class="flex flex-wrap justify-center gap-3 mb-12">
      <button
        *ngFor="let tab of tabs"
        (click)="activeTab = tab"
        [class.bg-white]="activeTab === tab"
        [class.text-[#0a0f1e]]="activeTab === tab"
        [class.bg-[#0d1526]]="activeTab !== tab"
        [class.text-white]="activeTab !== tab"
        class="px-6 py-2 rounded-full border border-white/20 font-medium transition-all duration-300 hover:border-[#00e5a0]"
      >
        {{ tab }}
      </button>
    </div>

    <!-- Projects Grid -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
      <div
        *ngFor="let project of filteredProjects"
        class="bg-[#0d1526] border border-[#00e5a0]/10 rounded-2xl overflow-hidden hover:border-[#00e5a0]/40 hover:-translate-y-2 transition-all duration-300 group"
      >
        <!-- Image -->
        <div class="h-48 bg-[#060d1a] overflow-hidden flex items-center justify-center">
          <img
            *ngIf="project.image"
            [src]="project.image"
            [alt]="project.name"
            class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
          />
          <div *ngIf="!project.image" class="text-gray-600 text-4xl">🌐</div>
        </div>

        <!-- Content -->
        <div class="p-6">
          <span class="text-xs text-[#00e5a0] border border-[#00e5a0]/40 rounded-full px-3 py-1 font-mono">{{ project.type }}</span>
          <h3 class="text-white font-bold text-xl mt-3 mb-2 font-mono">{{ project.name }}</h3>
          <p class="text-gray-400 text-sm mb-4">{{ project.desc }}</p>

          <!-- Tech tags -->
          <div class="flex flex-wrap gap-2 mb-5">
            <span
              *ngFor="let tech of project.techs"
              class="text-xs text-gray-300 border border-gray-600 rounded px-2 py-1 font-mono"
            >
              &lt;/&gt; {{ tech }}
            </span>
          </div>

          <!-- CTA -->
          <a
            *ngIf="project.url"
            [href]="project.url"
            target="_blank"
            class="inline-block bg-[#00e5a0] text-[#0a0f1e] font-bold px-6 py-2 rounded-lg hover:bg-[#00c88a] transition-all duration-300 hover:scale-105 text-sm"
          >
            Visitar
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
